
appId: com.pozitron.hepsiburada
---
- runFlow:
    file: common/add_first_product.yaml

# Eklenen ürünün sepette yer aldığı doğrulanır
- assertVisible:
    id: "product_item_photo"

# Ürün adı 
- assertVisible:
    id: "productName"

# Ürün fiyatı 
- assertVisible:
    text: ".*TL"

# Ürün görseline tıkla
- tapOn:
    id: "product_item_photo"

# Ürün detaya dönüldüğünde "Sepete Ekle" butonu görünmeli
- assertVisible:
    id: "pdpAddToCart"
