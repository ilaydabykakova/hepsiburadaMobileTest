appId: com.pozitron.hepsiburada
---
- runFlow:
    file: common/add_first_product.yaml

# Eklenen ürünün sepette yer aldığı doğrulanır
- assertVisible:
    id: "product_item_photo"

# Ürün adı
- assertVisible:
    id: "productName"

# Ürün fiyatı
- assertVisible:
    text: ".*TL"
    above:
      id: "productName"

# Sil
- tapOn:
    text: "Ürünü sil"

# Sepet boş
- assertVisible:
    text: "Sepetin şu an boş"
