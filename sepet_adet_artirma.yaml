appId: com.pozitron.hepsiburada
---
- runFlow:
    file: common/add_first_product.yaml

# Eklenen ürünün sepette yer aldığı doğrulanır
- assertVisible:
    id: "product_item_photo"

# Ürün adı
- assertVisible:
    id: "productName"

# Ürün fiyatı 
- assertVisible:
    text: ".*TL"

# Adet 1 ise artırma 
- runFlow:
    when:
      visible: "Sepetim (1 ürün)"
    commands:
      - assertVisible:
          text: "1"

      - tapOn:
          text: "Ürün sayısını artır"

      - assertVisible:
          text: "2"

      - assertVisible:
          text: "Sepetim (2 ürün)"

# İşlem sonrası ürün bilgileri
- assertVisible:
    id: "productName"

- assertVisible:
    text: ".*TL"
    above:
      id: "productName"
