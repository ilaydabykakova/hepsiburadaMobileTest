
appId: com.pozitron.hepsiburada
---
- runFlow:
    file: common/go_to_basket.yaml

# Eklenen ürünün sepette yer aldığı doğrulanır
- assertVisible:
    id: "product_item_photo"

# Ürün adı
- assertVisible:
    id: "productName"

#  Kart/Taksit bilgisi
- runFlow:
    when:
      visible:
        id: "productInfoLabel"
    commands:
      - assertVisible:
          id: "productInfoLabel"

# Ürün fiyatı
- assertVisible:
    text: ".*TL"
    above:
      id: "productName"

# Kargo bilgisi 
- assertVisible:
    id: "productCargoInfoTxt"

# Sepet toplam fiyatı
- assertVisible:
    text: ".*TL"
    leftOf: "Ödemeye Geç"