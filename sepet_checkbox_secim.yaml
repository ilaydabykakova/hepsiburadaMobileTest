appId: com.pozitron.hepsiburada
---
- runFlow:
    file: common/go_to_basket.yaml

# Eklenen ürünün sepette yer aldığı doğrulanır
- assertVisible:
    id: "product_item_photo"

# Ürün adı
- assertVisible:
    id: "productName"

# Ürün fiyatı 
- assertVisible:
    text: ".*TL"

# Checkbox seçili
- assertVisible:
    text: "Ürün seçili"

# Seçimi kaldır
- tapOn:
    leftOf:
        id: "product_item_photo"

# Seçim kaldırıldı
- assertVisible:
    text: "Ürün seçili değil"

# Seçilen ürün 0 ise fiyat 0,00 TL
- runFlow:
    when:
      visible: "SEÇİLEN ÜRÜNLER (0)"
    commands:
      - assertVisible:
          text: "0,00 TL"