appId: com.pozitron.hepsiburada
---
- launchApp

- scrollUntilVisible:
    element:
      point: 0%,47%

- tapOn:
    id: "productBoxImage"

- tapOn: "Sepete ekle"

- runFlow:
    when:
      visible: "Ürün sepete başarılı bir şekilde eklenmiştir."
    commands:
      - runFlow:
          when:
            visible:
              id: "toolbarCartButton"
          commands:
            - tapOn:
                id: "toolbarCartButton"

- runFlow:
    when:
      visible: "Ürün sepete eklenemedi"
    commands:
      - swipe:
          direction: DOWN
      - tapOn:
          id: "toolbarCartButton"

- runFlow:
    when:
      visible: "Sepete git"
    commands:
      - tapOn: "Sepete git"