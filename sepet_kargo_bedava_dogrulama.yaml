appId: com.pozitron.hepsiburada
---
- runFlow:
    file: common/go_to_basket.yaml

# Eklenen ürünün sepette yer aldığı doğrulanır
- assertVisible:
    id: "product_item_photo"

# Ürün adı
- assertVisible:
    id: "productName"

# Ürün fiyatı
- assertVisible:
    text: ".*TL"

# CKargo bedava etiketi varsa -> Uygulandı 
- runFlow:
    when:
      visible: "500 TL üzerine kargo bedava"
    commands:
      - assertVisible:
          text: "Uygulandı"

# Kargo bilgisi alanı görünür
- assertVisible:
    id: "productCargoInfoTxt"

