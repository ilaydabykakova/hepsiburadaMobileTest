
appId: com.pozitron.hepsiburada
---
- runFlow:
    file: common/add_first_product.yaml

# Ürün bilgisi
- assertVisible:
    id: "productName"
- assertVisible:
    text: ".*TL"            
    above:                    
      id: "productName"

# Ürün detaya yönlendir.
- tapOn:
    id: "product_item_photo"

# Ürün detaya geri dönüldüğünde "Sepete Ekle" butonun görmeli.
- assertVisible:
    id: "pdpAddToCart"
